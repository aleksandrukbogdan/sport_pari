[project]
name = "user-svc"
version = "0.1.0"
description = "Auth service (mock login/registration) for the sport_pari platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
