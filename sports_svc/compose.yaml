services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sports
      POSTGRES_USER: sports
      POSTGRES_PASSWORD: sports_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sports_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sports -d sports"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sports_data: