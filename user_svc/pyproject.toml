[project]
name = "user-svc"
version = "0.1.0"
description = "Auth service (mock login/registration) for the sport_pari platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
