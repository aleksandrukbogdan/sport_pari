name: user-svc

services:
  vault:
    image: hashicorp/vault:1.18
    command: ["vault", "server", "-config=/vault/local/config.hcl"]
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./vault/config.hcl:/vault/local/config.hcl:ro
      - vault-data:/vault/file
    restart: unless-stopped

  vault-bootstrap:
    image: hashicorp/vault:1.18
    profiles: ["bootstrap"]
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
    volumes:
      - ./vault:/scripts:ro
      - ./vault/state:/state
    depends_on:
      - vault
    stdin_open: true
    tty: true

  vault-init:
    image: hashicorp/vault:1.18
    entrypoint: ["/bin/sh", "/scripts/init.sh"]
    environment:
      VAULT_ADDR: http://vault:8200
      APP_ENV: ${APP_ENV:-test}
    volumes:
      - ./vault:/scripts:ro
      - ./vault/state:/state:ro
      - secrets:/secrets
    depends_on:
      - vault
    restart: "no"

  postgres:
    image: postgres:16-alpine
    entrypoint: ["sh", "-c", ". /secrets/runtime.env && exec docker-entrypoint.sh postgres"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
    volumes:
      - keycloak-db:/var/lib/postgresql/data
      - secrets:/secrets:ro
    depends_on:
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    entrypoint: ["/bin/bash", "-c", ". /secrets/runtime.env && exec /opt/keycloak/bin/kc.sh start-dev --import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - secrets:/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak-sync:
    image: python:3.12-slim
    command: ["python", "-u", "/app/sync.py"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-test}
      VAULT_ADDR: http://vault:8200
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: sport-pari
      SYNC_INTERVAL: "30"
      EVENTS_INTERVAL: "10"
      EVENTS_WINDOW: "3600"
    volumes:
      - ./keycloak/sync.py:/app/sync.py:ro
      - ./vault/state:/state:ro
    depends_on:
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["sh", "-c", ". /secrets/runtime.env && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    volumes:
      - secrets:/secrets:ro
    depends_on:
      keycloak:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: sport-pari
      KEYCLOAK_CLIENT_ID: user-svc
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  keycloak-db:
  vault-data:
  secrets:
